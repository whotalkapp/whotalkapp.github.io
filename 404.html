<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhoTalk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: #0F0F0F;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background-color: #161616;
      border: 1px solid #262626;
      border-radius: 24px;
      padding: 44px 32px 36px 32px;
      text-align: center;
    }

    .logo-container {
      width: 64px;
      height: 64px;
      background-color: #1F1F1F;
      border: 1px solid #2E2E2E;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .logo-container svg {
      width: 36px;
      height: 36px;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #FFFFFF;
      margin-bottom: 6px;
    }

    .tagline {
      font-size: 14px;
      font-weight: 500;
      color: #A0A0A0;
      margin-bottom: 28px;
    }

    .notice-box {
      background-color: #1F1F1F;
      border: 1px solid #262626;
      border-radius: 16px;
      padding: 16px 20px;
      text-align: left;
      margin-bottom: 28px;
    }

    .notice-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #757575;
      margin-bottom: 4px;
    }

    .notice-title {
      font-size: 14px;
      font-weight: 600;
      color: #E6E6E6;
    }

    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 54px;
      background-color: #FFFFFF;
      color: #000000;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      border-radius: 20px;
      transition: background-color 0.2s ease, opacity 0.2s ease;
    }

    .btn-primary:active {
      opacity: 0.85;
    }

    .btn-primary svg {
      width: 20px;
      height: 20px;
    }

    .status-text {
      margin-top: 20px;
      font-size: 12px;
      font-weight: 500;
      color: #757575;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid #333333;
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Official WhoTalk Logo Vector -->
    <div class="logo-container">
      <svg viewBox="0 0 108 108" fill="none">
        <path d="M68.5 32L35 52.7895L48 57L61.8986 41.4211L52.5 59.5L63.2899 67.9474L68.5 32Z" fill="#FFFFFF"/>
        <path d="M61.8986 41.4211L52.5 59.5L63.2899 67.9474L68.5 32L35 52.7895L48 57L61.8986 41.4211ZM61.8986 41.4211C61.8986 41.4211 36.8551 75.0526 44.2754 76" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </div>

    <h1>WhoTalk</h1>
    <p class="tagline">Direct. Private. Encrypted.</p>

    <!-- Context Notice Box -->
    <div class="notice-box">
      <div class="notice-label" id="noticeLabel">Invitation</div>
      <div class="notice-title" id="noticeTitle">You have been invited to connect on WhoTalk</div>
    </div>

    <!-- Google Play Download Button -->
    <a href="https://play.google.com/store/apps/details?id=com.whotalk.app" id="playStoreBtn" class="btn-primary">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M3.6 1.7L13.8 12 3.6 22.3c-.4-.4-.6-1-.6-1.7V3.4c0-.7.2-1.3.6-1.7z"/>
        <path d="M17.3 8.6L14.7 11.2 13.8 12l.9.8 2.6 2.6 3.8-2.2c.7-.4.7-1.1 0-1.5l-3.8-3.1z"/>
        <path d="M14.7 11.2L3.6 1.7C4.1 1.3 4.8 1.4 5.4 1.8l11.9 6.8-2.6 2.6z"/>
        <path d="M14.7 12.8L5.4 22.2c-.6.4-1.3.5-1.8.1l11.1-9.5z"/>
      </svg>
      Get it on Google Play
    </a>

    <!-- Android Auto-redirect Indicator -->
    <div class="status-text" id="statusIndicator">
      <div class="spinner"></div>
      <span>Opening Google Play Store...</span>
    </div>
  </div>

  <script>
    const packageId = "com.whotalk.app";
    const playStoreWebUrl = "https://play.google.com/store/apps/details?id=" + packageId;
    const playStoreAppUrl = "market://details?id=" + packageId;

    const path = window.location.pathname.toLowerCase();
    const noticeLabel = document.getElementById("noticeLabel");
    const noticeTitle = document.getElementById("noticeTitle");

    // Dynamic Context Detection
    if (path.includes("/chat")) {
      noticeLabel.textContent = "Direct Conversation";
      noticeTitle.textContent = "Open WhoTalk to start this conversation";
    } else if (path.includes("/profile")) {
      noticeLabel.textContent = "User Profile";
      noticeTitle.textContent = "View profile details on WhoTalk";
    } else if (path.includes("/invite")) {
      noticeLabel.textContent = "Invitation";
      noticeTitle.textContent = "You have been invited to connect on WhoTalk";
    } else {
      noticeLabel.textContent = "Android App";
      noticeTitle.textContent = "Private and secure peer-to-peer messaging";
    }

    // Android Redirection
    const isAndroid = /android/i.test(navigator.userAgent);
    const statusIndicator = document.getElementById("statusIndicator");

    if (isAndroid) {
      setTimeout(() => {
        window.location.href = playStoreAppUrl;
      }, 300);

      setTimeout(() => {
        statusIndicator.innerHTML = "<span>Tap the button above if Play Store does not open automatically.</span>";
      }, 2500);
    } else {
      statusIndicator.innerHTML = "<span>Available on Android</span>";
    }
  </script>
</body>
</html>
