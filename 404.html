<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhoTalk - Private & Secure Messaging</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #151b26 0%, #090c10 100%);
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .container {
      max-width: 440px;
      width: 100%;
      background: rgba(22, 27, 34, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 80px rgba(79, 137, 255, 0.08);
      backdrop-filter: blur(16px);
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-badge {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #1c2433 0%, #111622 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .logo-badge svg {
      width: 44px;
      height: 44px;
      fill: #FFFFFF;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 15px;
      color: #8b949e;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .intent-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 14px 18px;
      font-size: 14px;
      color: #58a6ff;
      margin-bottom: 28px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-playstore {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #FFFFFF;
      color: #0d1117;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      padding: 16px 24px;
      border-radius: 18px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 18px rgba(255, 255, 255, 0.15);
    }

    .btn-playstore:hover {
      background: #e6edf3;
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(255, 255, 255, 0.25);
    }

    .btn-playstore svg {
      width: 24px;
      height: 24px;
    }

    .redirect-status {
      margin-top: 18px;
      font-size: 13px;
      color: #7d8590;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo-badge">
      <!-- Paper Plane Logo -->
      <svg viewBox="0 0 24 24">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </div>

    <h1>WhoTalk</h1>
    <p class="tagline">Ultra-secure, fast, and private communication for modern conversations.</p>

    <div class="intent-box" id="intentBox">
      <span>✉️ You have an invite to chat on WhoTalk!</span>
    </div>

    <a href="https://play.google.com/store/apps/details?id=com.whotalk.app" id="playStoreBtn" class="btn-playstore">
      <svg viewBox="0 0 24 24">
        <path fill="#4285F4" d="M3.6 1.7L13.8 12 3.6 22.3c-.4-.4-.6-1-.6-1.7V3.4c0-.7.2-1.3.6-1.7z"/>
        <path fill="#FBBC04" d="M17.3 8.6L14.7 11.2 13.8 12l.9.8 2.6 2.6 3.8-2.2c.7-.4.7-1.1 0-1.5l-3.8-3.1z"/>
        <path fill="#EA4335" d="M14.7 11.2L3.6 1.7C4.1 1.3 4.8 1.4 5.4 1.8l11.9 6.8-2.6 2.6z"/>
        <path fill="#34A853" d="M14.7 12.8L5.4 22.2c-.6.4-1.3.5-1.8.1l11.1-9.5z"/>
      </svg>
      Get it on Google Play
    </a>

    <div class="redirect-status" id="redirectStatus">
      <span class="spinner"></span> Redirecting to Google Play...
    </div>
  </div>

  <script>
    const packageId = "com.whotalk.app";
    const playStoreWebUrl = "https://play.google.com/store/apps/details?id=" + packageId;
    const playStoreAppUrl = "market://details?id=" + packageId;

    // 1. Detect dynamic route intention
    const path = window.location.pathname.toLowerCase();
    const intentBox = document.getElementById("intentBox");

    if (path.includes("/chat")) {
      intentBox.innerHTML = "<span>💬 Someone invited you to chat on WhoTalk!</span>";
    } else if (path.includes("/profile")) {
      intentBox.innerHTML = "<span>👤 View user profile on WhoTalk!</span>";
    } else if (path.includes("/invite")) {
      intentBox.innerHTML = "<span>🎉 You've been invited to join WhoTalk!</span>";
    } else {
      intentBox.innerHTML = "<span>🚀 Fast & Private Chat Messenger</span>";
    }

    // 2. Android device auto-redirection
    const isAndroid = /android/i.test(navigator.userAgent);
    const redirectStatus = document.getElementById("redirectStatus");

    if (isAndroid) {
      // Android detected: Try native Play Store app protocol
      setTimeout(() => {
        window.location.href = playStoreAppUrl;
      }, 300);

      // Fallback to web link if market:// doesn't respond
      setTimeout(() => {
        redirectStatus.innerHTML = "Tap the button above if Play Store didn't open automatically.";
      }, 2500);
    } else {
      // Non-Android (Desktop/iOS): Keep neat landing page
      redirectStatus.style.display = "none";
    }
  </script>
</body>
</html>
